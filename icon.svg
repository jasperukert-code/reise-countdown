<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- App-Icon: Gaucho zu Pferd als Scherenschnitt.
       Die Silhouette entsteht aus ueberlappenden Ellipsen und Polygonen
       in einer Farbe — das laesst sich 1:1 nach Pillow portieren und
       haelt auch bei 60 px noch zusammen. Motiv bleibt in den inneren
       80 %, weil iOS die Ecken abrundet. -->
  <defs>
    <linearGradient id="grund" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2C48"/>
      <stop offset="1" stop-color="#0C1322"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#grund)"/>
  <circle cx="118" cy="104" r="240" fill="#3A5FBF" opacity=".15"/>
  <circle cx="424" cy="444" r="215" fill="#B8353F" opacity=".13"/>

  <!-- Abendsonne hinter dem Reiter -->
  <circle cx="262" cy="248" r="153" fill="#E4AC38" opacity=".12"/>
  <circle cx="262" cy="248" r="153" fill="none" stroke="#E4AC38" stroke-width="3" opacity=".3"/>

  <g fill="#F0C463">
    <!-- Hintere Beine zuerst, damit die vorderen darueber liegen -->
    <polygon points="298,268 310,268 306,320 302,374 292,374 292,320"/>
    <polygon points="196,266 210,266 208,320 204,374 193,374 192,320"/>

    <!-- Rumpf, Kruppe, Brust -->
    <ellipse cx="262" cy="246" rx="88" ry="32"/>
    <ellipse cx="205" cy="240" rx="36" ry="32"/>
    <ellipse cx="322" cy="246" rx="30" ry="32"/>

    <!-- Vordere Beine -->
    <polygon points="318,266 334,266 338,320 340,378 327,378 324,320"/>
    <polygon points="222,266 238,266 242,320 246,378 233,378 228,320"/>

    <!-- Hals -->
    <polygon points="310,216 336,186 356,164 374,160 380,180 368,196 352,216 338,244 320,256"/>

    <!-- Kopf: Genick, Stirn, Nasenruecken, Maul, Ganasche -->
    <polygon points="358,168 382,157 400,173 412,193 410,205 394,205 376,196 360,186"/>
    <!-- Ohr -->
    <polygon points="366,162 371,144 380,159"/>

    <!-- Schweif, im Wind nach hinten -->
    <polygon points="184,222 156,228 132,250 116,282 112,306 130,309 140,278 156,254 176,238 190,234"/>

    <!-- Sattel -->
    <polygon points="238,214 278,211 282,224 270,230 242,232 234,224"/>

    <!-- Reiter: Oberschenkel, Unterschenkel, Stiefel -->
    <polygon points="240,208 272,206 274,223 248,231 237,223"/>
    <polygon points="248,227 261,226 256,262 242,260"/>
    <polygon points="238,256 258,254 258,266 236,266"/>

    <!-- Rumpf des Reiters, leicht nach vorn geneigt -->
    <polygon points="250,214 276,211 282,172 262,166 251,190"/>

    <!-- Poncho, im Wind nach hinten -->
    <polygon points="260,174 242,194 233,222 251,220 261,192"/>

    <!-- Arm zu den Zuegeln -->
    <polygon points="268,174 282,170 322,194 316,206 276,186"/>

    <!-- Kopf -->
    <circle cx="272" cy="154" r="13"/>

    <!-- Breitkrempiger Hut -->
    <ellipse cx="272" cy="140" rx="31" ry="6"/>
    <polygon points="259,140 259,125 265,118 280,118 285,126 285,140"/>
  </g>

  <!-- Zuegel -->
  <path d="M318 198 L364 190 L400 192" fill="none" stroke="#F0C463"
        stroke-width="3.5" stroke-linecap="round"/>

  <!-- Boden -->
  <path d="M118 394 L398 394" stroke="#E4AC38" stroke-width="5"
        stroke-linecap="round" opacity=".7"/>
  <path d="M140 408 L212 408 M244 408 L300 408 M328 408 L370 408"
        stroke="#E4AC38" stroke-width="3" stroke-linecap="round" opacity=".3"/>
</svg>
