<!doctype html>

<head>

<!-- Auf dem Startbildschirm erscheint die Seite als „Vámonos“ -->
<link rel="manifest" href="manifest.webmanifest">

<meta name="mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#101A2E" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#EFEAD9" media="(prefers-color-scheme: light)">

<style>
/* Minimaler Reset */
html, body { margin: 0; padding: 0; background: var(--grund); }
img, svg { max-width: 100%; }
button { font: inherit; }

/* ============================================================
   TOKENS — Fileteado Porteño trifft Talavera
   ============================================================ */
:root {
  /* Grundfarben */
  --noche:      #101A2E;   /* tiefes Nachtblau */
  --noche-2:    #16233C;   /* angehobenes Nachtblau */
  --papel:      #EFEAD9;   /* Kalkpapier */
  --papel-2:    #E4DDC8;   /* Kalkpapier, gealtert */

  /* Akzente */
  --oro:        #E4AC38;   /* Gold / Ocker */
  --oro-tief:   #B07F1E;
  --carmin:     #B8353F;   /* Karminrot */
  --carmin-hell:#D95560;
  --jade:       #2E9E8F;   /* Jade */
  --cobalto:    #3A5FBF;   /* Kobaltblau */

  /* Semantische Tokens — hier hängt alles dran */
  --grund:      var(--noche);
  --grund-2:    var(--noche-2);
  --schrift:    #F2EDE0;
  --schrift-2:  #A9B4C9;   /* Neutral mit Blaustich, nicht grau */
  --linie:      rgba(228, 172, 56, .26);
  --linie-satt: rgba(228, 172, 56, .55);
  --akzent:     var(--oro);
  --auf-akzent: var(--noche);   /* Schrift auf Akzentflächen */
  --akzent-2:   var(--carmin-hell);
  --schatten:   0 18px 44px rgba(0,0,0,.44);
  --karte:      #18253E;
  --karte-2:    #1E2E4C;
  --verschlossen: rgba(255,255,255,.045);

  /* Kartenflächen */
  --wasser:       #0C1526;
  --wasser-linie: #2C4E7A;
  --land:         #23334F;
  --kueste-linie: #4A6285;
  --relief:       #2E415F;
  --relief-hoch:  #6E7F98;

  /* Typo */
  --display: "Bodoni MT", "Didot", "Playfair Display", "Hoefler Text", Georgia, serif;
  --body: "Avenir Next", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "SF Mono", ui-monospace, "Cascadia Mono", "Roboto Mono", "DejaVu Sans Mono", monospace;

  --w: min(1120px, 92vw);
  --r: 4px;
}

@media (prefers-color-scheme: light) {
  :root {
    --grund:    var(--papel);
    --grund-2:  var(--papel-2);
    --schrift:  #1B1F2E;
    --schrift-2:#5C6070;
    --linie:    rgba(27,31,46,.16);
    --linie-satt: rgba(184,53,63,.5);
    --akzent:   var(--carmin);
    --auf-akzent: #FFF7EA;
    --akzent-2: var(--oro-tief);
    --schatten: 0 14px 34px rgba(27,31,46,.16);
    --karte:    #FBF7EC;
    --karte-2:  #F4EFDF;
    --verschlossen: rgba(27,31,46,.05);
    --wasser:       #CFDDE8;
    --wasser-linie: #6E93B4;
    --land:         #F1EADA;
    --kueste-linie: #9AA6A0;
    --relief:       #E2D9C2;
    --relief-hoch:  #A99C7E;
  }
}

:root[data-theme="light"] {
  --grund:    var(--papel);
  --grund-2:  var(--papel-2);
  --schrift:  #1B1F2E;
  --schrift-2:#5C6070;
  --linie:    rgba(27,31,46,.16);
  --linie-satt: rgba(184,53,63,.5);
  --akzent:   var(--carmin);
  --auf-akzent: #FFF7EA;
  --akzent-2: var(--oro-tief);
  --schatten: 0 14px 34px rgba(27,31,46,.16);
  --karte:    #FBF7EC;
  --karte-2:  #F4EFDF;
  --verschlossen: rgba(27,31,46,.05);
  --wasser:       #CFDDE8;
  --wasser-linie: #6E93B4;
  --land:         #F1EADA;
  --kueste-linie: #9AA6A0;
  --relief:       #E2D9C2;
  --relief-hoch:  #A99C7E;
}

:root[data-theme="dark"] {
  --grund:    var(--noche);
  --grund-2:  var(--noche-2);
  --schrift:  #F2EDE0;
  --schrift-2:#A9B4C9;
  --linie:    rgba(228,172,56,.26);
  --linie-satt: rgba(228,172,56,.55);
  --akzent:   var(--oro);
  --auf-akzent: var(--noche);
  --akzent-2: var(--carmin-hell);
  --schatten: 0 18px 44px rgba(0,0,0,.44);
  --karte:    #18253E;
  --karte-2:  #1E2E4C;
  --verschlossen: rgba(255,255,255,.045);
  --wasser:       #0C1526;
  --wasser-linie: #2C4E7A;
  --land:         #23334F;
  --kueste-linie: #4A6285;
  --relief:       #2E415F;
  --relief-hoch:  #6E7F98;
}

* { box-sizing: border-box; }

.wrap {
  background: var(--grund);
  color: var(--schrift);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  /* Am Startbildschirm läuft die Seite randlos — Statusleiste aussparen */
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* Kalkputz-Textur, sehr subtil */
.wrap::before {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  opacity: .5;
  background-image:
    radial-gradient(circle at 15% 12%, rgba(58,95,191,.16), transparent 42%),
    radial-gradient(circle at 85% 78%, rgba(184,53,63,.14), transparent 46%);
  z-index: 0;
}

.inner { width: var(--w); margin: 0 auto; position: relative; z-index: 1; }

/* ============================================================
   PAPEL PICADO — Wimpelkette
   ============================================================ */
.picado { display: flex; width: 100%; height: 46px; overflow: hidden; }
.picado svg { display: block; width: 100%; height: 46px; }
.flag { transform-origin: top center; animation: schwingen 4.6s ease-in-out infinite; }
@keyframes schwingen {
  0%, 100% { transform: rotate(-1.4deg); }
  50%      { transform: rotate(1.4deg); }
}

/* ============================================================
   KOPF
   ============================================================ */
header { padding: 30px 0 12px; text-align: center; }

.eyebrow {
  font-family: var(--mono);
  font-size: .68rem;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: var(--akzent);
  margin: 0 0 14px;
}

h1 {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(2.1rem, 7.4vw, 4.1rem);
  line-height: 1.02;
  letter-spacing: -.012em;
  margin: 0 0 6px;
  text-wrap: balance;
  color: var(--schrift);
}
h1 em {
  font-style: italic;
  color: var(--akzent);
  text-shadow: 2px 3px 0 rgba(184,53,63,.32);
}

.untertitel {
  color: var(--schrift-2);
  font-size: .96rem;
  margin: 0 auto 26px;
  max-width: 46ch;
  text-wrap: balance;
}

/* Route */
.route {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; flex-wrap: wrap;
  margin: 0 0 30px;
  font-family: var(--mono);
  font-size: .7rem;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--schrift-2);
}
.route b { color: var(--schrift); font-weight: 600; }
.route span[aria-hidden] { color: var(--akzent); }

/* Sprungleiste, nur im Vorschaumodus */
.vorschau-leiste {
  display: flex; flex-wrap: wrap; gap: 7px;
  align-items: center; justify-content: center;
  margin: -12px auto 26px;
  padding: 12px 14px;
  max-width: 30rem;
  border: 1px dashed var(--linie-satt);
  border-radius: var(--r);
  background: var(--verschlossen);
}
.vl-titel {
  font-family: var(--mono); font-size: .6rem;
  letter-spacing: .18em; text-transform: uppercase;
  color: var(--schrift-2); margin-right: 4px;
}
.vl-knopf {
  font-family: var(--mono); font-size: .78rem;
  font-variant-numeric: tabular-nums;
  min-width: 34px; padding: 6px 8px;
  background: var(--karte);
  color: var(--schrift);
  border: 1px solid var(--linie);
  border-radius: var(--r);
  cursor: pointer;
}
.vl-knopf:hover { border-color: var(--akzent); color: var(--akzent); }
.vl-knopf:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }
.vl-aus {
  letter-spacing: .1em;
  text-transform: uppercase;
  font-size: .6rem;
  color: var(--schrift-2);
  border-style: dashed;
}

/* Countdown-Uhr */
.uhr {
  display: inline-flex; gap: 2px;
  border: 1px solid var(--linie-satt);
  border-radius: var(--r);
  overflow: hidden;
  background: var(--grund-2);
  box-shadow: var(--schatten);
  margin-bottom: 8px;
}
.uhr div {
  padding: 12px 16px 10px;
  min-width: 74px;
  background: var(--karte);
}
.uhr .z {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: clamp(1.45rem, 5vw, 2.15rem);
  font-weight: 600;
  line-height: 1;
  color: var(--akzent);
  display: block;
}
.uhr .l {
  font-size: .58rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--schrift-2);
  margin-top: 6px;
  display: block;
}
.uhr-hinweis {
  font-size: .74rem;
  color: var(--schrift-2);
  margin: 4px 0 34px;
  font-family: var(--mono);
  letter-spacing: .08em;
}

/* ============================================================
   KACHELFELD
   ============================================================ */
.feld {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  padding-bottom: 40px;
}
@media (min-width: 760px) {
  .feld { grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .t1 { grid-column: span 2; grid-row: span 2; }
  .t4 { grid-column: span 2; }
  .t7 { grid-column: span 2; }
}
@media (max-width: 759px) {
  .t1, .t4, .t7 { grid-column: span 2; }
}

.tuer {
  position: relative;
  border: 1px solid var(--linie);
  border-radius: var(--r);
  background: var(--karte);
  color: inherit;
  font-family: inherit;
  padding: 18px 16px 16px;
  min-height: 132px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  text-align: left;
  cursor: pointer;
  overflow: hidden;
  transition: transform .22s cubic-bezier(.2,.8,.3,1), border-color .22s, box-shadow .22s;
}
.t1 { min-height: 200px; }

/* Talavera-Eckornament */
.tuer::after {
  content: "";
  position: absolute;
  inset: 5px;
  border: 1px solid var(--linie);
  border-radius: 2px;
  pointer-events: none;
  opacity: .55;
}

.tuer:hover:not(.zu),
.tuer:focus-visible:not(.zu) {
  transform: translateY(-3px);
  border-color: var(--linie-satt);
  box-shadow: var(--schatten);
}
.tuer:focus-visible {
  outline: 2px solid var(--akzent);
  outline-offset: 3px;
}

.tuer .datum {
  font-family: var(--mono);
  font-size: .64rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--schrift-2);
}
.tuer .icon { display: block; line-height: 0; color: var(--akzent); }
.tuer .icon svg { display: block; }
.tuer .titel {
  font-family: var(--display);
  font-size: 1.14rem;
  font-weight: 700;
  line-height: 1.16;
  letter-spacing: -.005em;
  text-wrap: balance;
}
.t1 .titel { font-size: clamp(1.3rem, 3.6vw, 1.75rem); }
.tuer .teaser {
  font-size: .8rem;
  color: var(--schrift-2);
  line-height: 1.45;
}

/* Zustände */
.tuer.zu {
  background: var(--verschlossen);
  cursor: not-allowed;
  border-style: dashed;
}
.tuer.zu .icon,
.tuer.zu .titel,
.tuer.zu .teaser { filter: blur(4px); opacity: .3; user-select: none; }
.tuer.zu .schloss {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: .66rem;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--schrift-2);
}
.tuer.zu .schloss .s-icon { filter: none; opacity: .55; line-height: 0; color: var(--akzent); }
.tuer:not(.zu) .schloss { display: none; }

.tuer.heute {
  border-color: var(--akzent);
  border-style: solid;
  background: var(--karte-2);
}
.tuer.heute::before {
  content: "Heute";
  position: absolute;
  top: 0; right: 0;
  background: var(--akzent);
  color: var(--auf-akzent);
  font-family: var(--mono);
  font-size: .58rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  padding: 4px 9px 3px;
  border-bottom-left-radius: var(--r);
  z-index: 2;
  font-weight: 600;
}
.tuer.heute:not(.gesehen) .icon { animation: wippen 2.4s ease-in-out infinite; }
@keyframes wippen {
  0%, 88%, 100% { transform: rotate(0) scale(1); }
  92%  { transform: rotate(-9deg) scale(1.1); }
  96%  { transform: rotate(9deg) scale(1.1); }
}

.tuer.gesehen .haken {
  position: absolute; bottom: 10px; right: 12px;
  font-size: .7rem; color: var(--jade);
  font-family: var(--mono);
  letter-spacing: .1em;
}

footer {
  border-top: 1px solid var(--linie);
  padding: 24px 0 60px;
  text-align: center;
  font-size: .78rem;
  color: var(--schrift-2);
  font-family: var(--mono);
  letter-spacing: .08em;
}

/* ============================================================
   OVERLAY
   ============================================================ */
.overlay {
  position: fixed; inset: 0;
  z-index: 60;
  background: color-mix(in srgb, var(--grund) 96%, black);
  display: none;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.overlay.auf { display: block; animation: einblenden .3s ease; }
@keyframes einblenden { from { opacity: 0; } to { opacity: 1; } }

/* Das Overlay liegt außerhalb von .wrap, muss die Statusleiste also
   selbst aussparen — im Standalone-Modus klebte das Schließkreuz sonst
   am oberen Bildschirmrand. */
.overlay-inner {
  width: min(720px, 92vw);
  margin: 0 auto;
  padding: calc(30px + env(safe-area-inset-top, 0px)) 0 90px;
  position: relative;
  z-index: 1;
}

.schliessen {
  position: sticky;
  top: calc(26px + env(safe-area-inset-top, 0px));
  float: right;
  z-index: 5;
  background: var(--karte);
  border: 1px solid var(--linie-satt);
  color: var(--schrift);
  border-radius: 50%;
  width: 40px; height: 40px;
  font-size: 1.15rem;
  cursor: pointer;
  line-height: 1;
  transition: background .2s, transform .2s;
}
.schliessen:hover { background: var(--akzent); color: var(--auf-akzent); transform: rotate(90deg); }
.schliessen:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }

.o-kopf { padding-top: 22px; margin-bottom: 26px; clear: both; }
.o-datum {
  font-family: var(--mono);
  font-size: .66rem;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: var(--akzent);
  margin-bottom: 10px;
}
.o-titel {
  font-family: var(--display);
  font-size: clamp(1.8rem, 6vw, 2.9rem);
  font-weight: 700;
  line-height: 1.06;
  margin: 0 0 12px;
  text-wrap: balance;
}
.o-lead {
  color: var(--schrift-2);
  font-size: 1rem;
  max-width: 58ch;
  margin: 0;
  text-wrap: pretty;
}

.o-inhalt > * + * { margin-top: 18px; }
.o-inhalt p { max-width: 64ch; text-wrap: pretty; }

/* Karte / Panel */
.panel {
  background: var(--karte);
  border: 1px solid var(--linie);
  border-radius: var(--r);
  padding: 20px 18px;
}
.panel-titel {
  font-family: var(--mono);
  font-size: .66rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--akzent);
  margin: 0 0 14px;
}

/* Buttons */
.btn {
  font-family: var(--mono);
  font-size: .74rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  background: var(--akzent);
  color: var(--auf-akzent);
  border: 1px solid var(--akzent);
  border-radius: var(--r);
  padding: 11px 20px;
  cursor: pointer;
  font-weight: 600;
  transition: filter .2s, transform .12s;
}
.btn:hover { filter: brightness(1.12); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--akzent-2); outline-offset: 3px; }
.btn.geist {
  background: transparent;
  color: var(--schrift);
  border-color: var(--linie-satt);
}
.btn.geist:hover { background: var(--verschlossen); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }

/* Notiz / persönliche Nachricht */
.notiz {
  background: linear-gradient(180deg, var(--karte-2), var(--karte));
  border: 1px solid var(--linie-satt);
  border-left: 3px solid var(--carmin-hell);
  border-radius: var(--r);
  padding: 20px 20px 18px;
  font-family: var(--display);
  font-size: 1.1rem;
  line-height: 1.55;
  font-style: italic;
}
.notiz .sig {
  display: block;
  margin-top: 12px;
  font-family: var(--mono);
  font-style: normal;
  font-size: .68rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--akzent);
}

/* ============================================================
   TAG 1 — Karte
   ============================================================ */
.karte-svg { width: 100%; height: auto; display: block; border-radius: var(--r); }
.route-linie {
  fill: none;
  stroke: var(--akzent);
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-dasharray: 7 9;
  stroke-dashoffset: 1200;
  animation: zeichnen 3.4s ease-out forwards;
}
@keyframes zeichnen { to { stroke-dashoffset: 0; } }
.stadt-punkt { fill: var(--carmin-hell); opacity: 0; animation: aufpoppen .5s ease-out forwards; }
.stadt-ring { fill: none; stroke: var(--carmin-hell); stroke-width: 1.6; opacity: 0; animation: pulsring 2.6s ease-out infinite; }
@keyframes aufpoppen { from { opacity: 0; r: 0; } to { opacity: 1; } }
@keyframes pulsring {
  0% { opacity: .8; transform: scale(.4); }
  70%, 100% { opacity: 0; transform: scale(1.8); }
}
/* Marker liegen in gegenskalierten Gruppen — hier gelten feste Größen */
.stadt-label {
  font-family: var(--mono);
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: .08em;
  fill: var(--schrift);
  paint-order: stroke;
  stroke: var(--karte);
  stroke-width: 3.5px;
  stroke-linejoin: round;
  opacity: 0;
  animation: einfaden .6s ease-out forwards;
}

/* Kartenflächen: Wasser dunkel und kühl, Land heller und wärmer —
   damit auf einen Blick klar ist, was Küste ist und was Ozean. */
.karte-svg .ozean { fill: var(--wasser); }
.karte-svg .kueste { fill: var(--land); stroke: var(--kueste-linie); }
.karte-svg .gebirge {
  fill: var(--relief);
  stroke: none;
}
.karte-svg .gewaesser {
  fill: var(--wasser);
  stroke: var(--kueste-linie);
  stroke-width: calc(.7px * var(--k, 1));
}
.karte-svg .fluss {
  fill: none;
  stroke: var(--wasser-linie);
  stroke-width: calc(1.4px * var(--k, 1));
}
.karte-svg .gipfel {
  fill: var(--relief-hoch);
  stroke: var(--land);
  stroke-width: .5px;
  transform: scale(1.5);
}
.gipfel-schicht { opacity: 0; transition: opacity .35s; pointer-events: none; }
.karte-svg.gezoomt .gipfel-schicht { opacity: 1; }

/* Beim Zoom skaliert die viewBox — Punkte, Linien und Schrift werden
   über --k gegengerechnet, damit sie optisch gleich groß bleiben. */
.karte-svg .kueste { stroke-width: calc(1px * var(--k, 1)); }
.karte-svg .breitengrad {
  stroke: var(--linie);
  stroke-width: calc(.8px * var(--k, 1));
  stroke-dasharray: calc(3px * var(--k, 1)) calc(7px * var(--k, 1));
  opacity: .7;
}
.karte-svg .route-linie { stroke-width: calc(2.4px * var(--k, 1)); }
.karte-svg .fahrt-linie {
  fill: none;
  stroke: var(--jade);
  stroke-width: calc(1.6px * var(--k, 1));
  stroke-dasharray: calc(2px * var(--k, 1)) calc(4px * var(--k, 1));
  stroke-linecap: round;
  opacity: 0;
  transition: opacity .4s;
}
.karte-svg.gezoomt .fahrt-linie { opacity: .85; }
.karte-svg.gezoomt .route-linie { opacity: .18; }

/* Maßstabsleiste erscheint erst im Zoom */
.massstab { opacity: 0; transition: opacity .35s; pointer-events: none; }
.karte-svg.gezoomt .massstab { opacity: 1; }
.massstab text {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .12em;
  fill: var(--schrift-2);
}

/* Regionspunkte blenden beim Zoom aus, Einzelorte ein */
.station { transition: opacity .3s; }
.station.weg { opacity: 0; pointer-events: none; }

.detailort { opacity: 0; pointer-events: none; transition: opacity .35s; }
.detailort.sichtbar { opacity: 1; }
.detail-punkt {
  fill: var(--carmin-hell);
  stroke: var(--karte);
  stroke-width: 1.5px;
}
.detail-label {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .04em;
  fill: var(--schrift);
  paint-order: stroke;
  stroke: var(--karte);
  stroke-width: 3.2px;
  stroke-linejoin: round;
}

/* Flugzeug für die Abflug-Animation */
.flieger-marke .flieger-form {
  fill: var(--akzent);
  stroke: var(--karte);
  stroke-width: 1px;
}

/* Zurück-Knopf und Kilometerzähler */
.k-zurueck {
  float: right;
  font-family: var(--mono);
  font-size: .62rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  background: none;
  border: 1px solid var(--linie-satt);
  border-radius: var(--r);
  color: var(--akzent);
  padding: 3px 9px;
  cursor: pointer;
  margin-top: -3px;
}
.k-zurueck:hover { background: var(--verschlossen); }
.k-zurueck:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }

.k-steuerung {

}

/* Zeile mit Höhe und Temperatur unter jeder Etappe */
.et-lage {
  margin: 6px 0 0;

  font-size: .64rem;
  letter-spacing: .1em;
  text-transform: uppercase;

}

/* Ausflüge, eingerückt unter der Basisetappe */
.et-dazu {
  margin: 12px 0 0 14px;

  border-left: 2px solid var(--linie);
}
.ed-kopf { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 9px; margin-bottom: 4px; }
.ed-kopf b { font-family: var(--display); font-size: 1rem; }
.ed-wann {
  font-family: var(--mono); font-size: .62rem;
  color: var(--akzent); font-variant-numeric: tabular-nums;
}
.ed-was {
  font-family: var(--mono); font-size: .56rem;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--schrift-2); margin-left: auto;
}
.et-dazu p { margin: 0; font-size: .84rem; line-height: 1.5; color: var(--schrift-2); }
@keyframes einfaden { to { opacity: 1; } }
.flieger { offset-path: var(--pfad); animation: fliegen 3.4s ease-out forwards; font-size: 15px; }

/* Antippbare Stationen */
.station { cursor: pointer; }
.station:focus { outline: none; }
.station:focus-visible .stadt-punkt,
.station:hover .stadt-punkt { fill: var(--oro); r: 7; }
.station.aktiv .stadt-punkt { fill: var(--oro); r: 7; }
.station:focus-visible text { text-decoration: underline; }
.stadt-punkt { transition: fill .18s, r .18s; }

/* Infofeld unter der Karte */
.karten-info {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--linie);

}
.ki-leer {
  font-family: var(--mono);
  font-size: .7rem;
  letter-spacing: .12em;
  text-transform: uppercase;

}
.ki-eintrag + .ki-eintrag { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--linie); }
.ki-kopf {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
  margin-bottom: 6px;
}
.ki-kopf b { font-family: var(--display); font-size: 1.2rem; }
.ki-nr, .ki-daten {
  font-family: var(--mono); font-size: .6rem;
  letter-spacing: .16em; text-transform: uppercase;
}
.ki-nr { color: var(--akzent); }
.ki-daten { color: var(--jade); margin-left: auto; white-space: nowrap; }
.karten-info p { margin: 0; font-size: .88rem; line-height: 1.55; color: var(--schrift-2); }

/* Etappenliste */
.etappe { padding: 14px 0; border-top: 1px solid var(--linie); }
.et-kopf { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 5px; }
.et-nr {
  font-family: var(--mono); font-size: .68rem;
  color: var(--akzent); font-variant-numeric: tabular-nums;
}
.et-ort { font-family: var(--display); font-size: 1.15rem; font-weight: 700; }
.et-daten {
  font-family: var(--mono); font-size: .6rem;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--jade); margin-left: auto; white-space: nowrap;
}
.et-fakt { margin: 0; font-size: .88rem; color: var(--schrift-2); line-height: 1.55; }

/* ============================================================
   TAG 2 — Quiz
   ============================================================ */
.q-fortschritt {
  font-family: var(--mono);
  font-size: .66rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--schrift-2);
  margin-bottom: 8px;
  display: flex; justify-content: space-between;
}
.q-balken { height: 3px; background: var(--verschlossen); border-radius: 2px; overflow: hidden; margin-bottom: 22px; }
.q-balken i { display: block; height: 100%; background: var(--akzent); transition: width .4s cubic-bezier(.2,.8,.3,1); }
.q-frage {
  font-family: var(--display);
  font-size: clamp(1.25rem, 4.4vw, 1.7rem);
  font-weight: 700;
  line-height: 1.2;

}
.q-optionen { display: flex; flex-direction: column; gap: 9px; }
.q-opt {
  text-align: left;

  border: 1px solid var(--linie);
  border-radius: var(--r);
  color: var(--schrift);
  font-family: var(--body);
  font-size: .93rem;

}
.q-opt:hover:not(:disabled) { border-color: var(--linie-satt); transform: translateX(3px); }
.q-opt:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }
.q-opt .marke {
  font-family: var(--mono);

  flex-shrink: 0;
}
.q-opt.richtig { border-color: var(--jade); background: color-mix(in srgb, var(--jade) 14%, var(--karte)); }
.q-opt.falsch  { border-color: var(--carmin-hell); background: color-mix(in srgb, var(--carmin-hell) 12%, var(--karte)); }
.q-opt:disabled { cursor: default; }
.q-erklaerung {
  margin-top: 16px;
  padding: 14px 16px;
  background: var(--verschlossen);
  border-left: 2px solid var(--akzent);
  border-radius: 0 var(--r) var(--r) 0;
  font-size: .89rem;
  line-height: 1.55;
  color: var(--schrift-2);
}
.q-erklaerung b { color: var(--schrift); font-weight: 600; }
.q-ergebnis { text-align: center; padding: 22px 0; }
.q-punkte {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: clamp(3rem, 13vw, 5rem);
  font-weight: 600;
  line-height: 1;
  color: var(--akzent);
}
.q-punkte small { font-size: .3em; color: var(--schrift-2); }

/* ============================================================
   TAG 3 — Rubbellose
   ============================================================ */
.lose { display: grid; gap: 14px; }
/* Der Inhalt bestimmt die Höhe, die Rubbelschicht legt sich darüber —
   sonst wird ein längerer Text unter der Kante abgeschnitten. */
.los {
  position: relative;
  border: 1px solid var(--linie-satt);
  border-radius: var(--r);
  overflow: hidden;
  background: var(--karte);
}
.los-inhalt {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 7px;
  padding: 20px 18px;
  min-height: 128px;
  text-align: center;
}
.los-inhalt .l-icon { line-height: 0; color: var(--akzent); }
.los-inhalt .l-land {
  font-family: var(--mono);
  font-size: .58rem;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--jade);
  margin-top: 2px;
}
.los-inhalt .l-titel {
  font-family: var(--display);
  font-size: 1.22rem;
  font-weight: 700;
  line-height: 1.2;
  text-wrap: balance;
}
.los-inhalt .l-text { font-size: .84rem; color: var(--schrift-2); max-width: 40ch; line-height: 1.45; }
.los canvas {
  position: absolute; inset: 0;
  display: block; width: 100%; height: 100%;
  cursor: crosshair; touch-action: none;
}
.los.frei canvas { display: none; }
.los.frei { animation: gewonnen .5s ease; }
@keyframes gewonnen {
  0%, 100% { transform: scale(1); }
  40% { transform: scale(1.035); }
}

/* ============================================================
   TAG 4 — Kofferspiel
   ============================================================ */
.spiel-huelle { position: relative; border-radius: var(--r); overflow: hidden; border: 1px solid var(--linie-satt); background: var(--grund-2); }
#kofferSpiel { display: block; width: 100%; touch-action: none; }
.spiel-hud {
  display: flex; gap: 18px; justify-content: space-between;
  font-family: var(--mono);
  font-size: .7rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--schrift-2);
  padding: 10px 14px;
  border-bottom: 1px solid var(--linie);
  background: var(--karte);
}
.spiel-hud b { color: var(--akzent); font-variant-numeric: tabular-nums; }
.spiel-overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px; padding: 24px; text-align: center;
  background: color-mix(in srgb, var(--grund) 88%, transparent);
  backdrop-filter: blur(3px);
}
.spiel-overlay h4 {
  font-family: var(--display);
  font-size: 1.6rem; font-weight: 700; margin: 0;
  text-wrap: balance;
}
.spiel-overlay p { font-size: .87rem; color: var(--schrift-2); max-width: 40ch; margin: 0; }
.spiel-overlay.weg { display: none; }

/* ============================================================
   TAG 5 — Sprachkarten
   ============================================================ */
.karten-gitter { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 11px; }
.kk { perspective: 900px; background: none; border: 0; padding: 0; cursor: pointer; height: 132px; font-family: inherit; }
.kk:focus-visible { outline: 2px solid var(--akzent); outline-offset: 3px; border-radius: var(--r); }
.kk-inner {
  display: block;
  position: relative; width: 100%; height: 100%;
  transition: transform .55s cubic-bezier(.3,.9,.3,1.1);
  transform-style: preserve-3d;
}
.kk.um .kk-inner { transform: rotateY(180deg); }
.kk-seite {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  border: 1px solid var(--linie);
  border-radius: var(--r);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 6px; padding: 12px; text-align: center;
  background: var(--karte);
}
.kk-vorn .de { font-size: .93rem; line-height: 1.3; text-wrap: balance; }
.kk-vorn .hinweis {
  font-family: var(--mono); font-size: .55rem;
  letter-spacing: .16em; text-transform: uppercase;
  color: var(--schrift-2);
}
.kk-hinten {
  transform: rotateY(180deg);
  background: var(--karte-2);
  border-color: var(--linie-satt);
}
.kk-hinten .es {
  font-family: var(--display);
  font-size: 1.02rem; font-weight: 700; line-height: 1.25;
  color: var(--akzent); text-wrap: balance;
}
.kk-hinten .lautschrift { font-family: var(--mono); font-size: .64rem; color: var(--schrift-2); letter-spacing: .04em; }
.kk-hinten .wo { font-family: var(--mono); font-size: .54rem; letter-spacing: .14em; text-transform: uppercase; color: var(--jade); }
.hoeren {
  margin-top: 4px;
  background: var(--verschlossen);
  border: 1px solid var(--linie);
  border-radius: 20px;
  font-size: .62rem;
  font-family: var(--mono);
  letter-spacing: .1em;
  color: var(--schrift-2);
  padding: 3px 10px;
  cursor: pointer;
}
.hoeren:hover { border-color: var(--akzent); color: var(--akzent); }

/* ============================================================
   TAG 6 — Packliste
   ============================================================ */
.pl-gruppe + .pl-gruppe { margin-top: 20px; }
.pl-kopf {
  font-family: var(--mono);
  font-size: .64rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--akzent);
  margin-bottom: 9px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--linie);
}
.pl-zeile {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  border: 1px solid transparent;
  border-radius: var(--r);
  cursor: pointer;
  transition: background .16s;
  width: 100%;
  text-align: left;
  background: none;
  color: inherit;
  font-family: inherit;
  font-size: .94rem;
}
.pl-zeile:hover { background: var(--verschlossen); }
.pl-zeile:focus-visible { outline: 2px solid var(--akzent); outline-offset: -1px; }
.pl-box {
  width: 19px; height: 19px; flex-shrink: 0;
  border: 1.5px solid var(--linie-satt);
  border-radius: 3px;
  display: grid; place-items: center;
  font-size: .74rem; color: transparent;
  transition: background .18s, border-color .18s, color .18s;
}
.pl-zeile.ab .pl-box { background: var(--jade); border-color: var(--jade); color: #fff; }
.pl-zeile.ab .pl-text { text-decoration: line-through; color: var(--schrift-2); }
.pl-text { flex: 1; line-height: 1.35; }
.pl-reaktion {
  font-size: .76rem; color: var(--jade);
  font-family: var(--mono); letter-spacing: .05em;
  opacity: 0; transition: opacity .25s;
  flex-shrink: 0;
}
.pl-zeile.ab .pl-reaktion { opacity: 1; }
.pl-stand {
  margin-top: 22px; padding: 16px;
  border: 1px dashed var(--linie-satt);
  border-radius: var(--r);
  text-align: center;
  font-family: var(--mono);
  font-size: .8rem;
  letter-spacing: .08em;
  color: var(--schrift-2);
}
.pl-stand b { color: var(--akzent); font-size: 1.5rem; font-variant-numeric: tabular-nums; display: block; margin-bottom: 4px; }

/* ============================================================
   TAG 7 — Boarding Pass
   ============================================================ */
.bp {
  background: var(--karte);
  border: 1px solid var(--linie-satt);
  border-radius: var(--r);

  box-shadow: var(--schatten);

}

  from { opacity: 0; transform: translateY(28px) rotate(-1.2deg); }

}
.bp-kopf {
  background: var(--akzent);
  color: var(--auf-akzent);
  padding: 12px 18px;
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--mono);
  font-size: .66rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  font-weight: 600;
}
.bp-koerper { padding: 22px 18px; }
.bp-strecke {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 24px;
}
.bp-ort .code {
  font-family: var(--display);
  font-size: clamp(1.9rem, 8vw, 3rem);
  font-weight: 700; line-height: 1;
}
.bp-ort .stadt {
  font-family: var(--mono); font-size: .6rem;
  letter-spacing: .16em; text-transform: uppercase;
  color: var(--schrift-2); margin-top: 5px;
}
.bp-pfeil { flex: 1; position: relative; height: 1px; background: var(--linie-satt); }
.bp-pfeil span {
  position: absolute; top: 50%; left: 0;
  transform: translate(-50%, -50%) rotate(90deg);
  line-height: 0;
  color: var(--akzent);
  animation: entlang 3.6s ease-in-out infinite;
}
@keyframes entlang {
  0%   { left: 0;    opacity: 0; }
  14%  { opacity: 1; }
  86%  { opacity: 1; }
  100% { left: 100%; opacity: 0; }
}
.bp-gitter {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
  gap: 18px 12px;
  padding-top: 20px;
  border-top: 1px dashed var(--linie-satt);
}
.bp-feld .k {
  font-family: var(--mono); font-size: .55rem;
  letter-spacing: .18em; text-transform: uppercase;
  color: var(--schrift-2); margin-bottom: 4px;
}
.bp-feld .v {
  font-family: var(--mono); font-size: .92rem;
  font-weight: 600; font-variant-numeric: tabular-nums;
  color: var(--schrift);
}
.bp-fuss {
  border-top: 1px dashed var(--linie-satt);
  padding: 14px 18px;
  display: flex; gap: 3px; align-items: flex-end;
  height: 62px;
  background: var(--karte-2);
}
.bp-fuss i { display: block; background: var(--schrift); width: 2px; height: 100%; opacity: .82; }

/* Konfetti-Canvas */
#konfetti {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 200;
}

/* Countdown im Finale */
.final-uhr {
  display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
  margin: 26px 0;
}
.final-uhr div {
  background: var(--karte); border: 1px solid var(--linie-satt);
  border-radius: var(--r); padding: 14px 18px; min-width: 84px; text-align: center;
}
.final-uhr .z {
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: 1.9rem; font-weight: 600; color: var(--akzent); line-height: 1;
}
.final-uhr .l {
  font-family: var(--mono); font-size: .55rem;
  letter-spacing: .18em; text-transform: uppercase;
  color: var(--schrift-2); margin-top: 6px;
}

.mitte { text-align: center; }
.knopfreihe { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
  .route-linie { stroke-dashoffset: 0; }
}

<div class="wrap">

<script>
(() => {

  set(k, v) { try { localStorage.setItem("cd7:" + k, JSON.stringify(v)); } catch {} }

const params = new URLSearchParams(location.search);

/* Der Vorschaumodus muss zwei Klippen überstehen, wenn die Seite zum
   Startbildschirm gelegt wird:
   1. Das Manifest gibt start_url vor und würde den Parameter schlucken —
      deshalb wird der Manifest-Link bei aktiver Vorschau entfernt, dann
      merkt sich das System die aufgerufene Adresse samt Parameter.
   2. Auf iOS hat eine Homescreen-App einen eigenen Speicher, getrennt
      von Safari. Greift Punkt 1 nicht, rettet das gemerkte Flag den
      Modus zumindest überall dort, wo der Speicher geteilt wird.
   Mit ?vorschau=0 lässt sich der Modus wieder abschalten. */
(() => {
  const p = params.get("vorschau");
  if (p === "0") speicher.set("vorschaumodus", false);
  else if (p === "1" || /\/vorschau\/?$/.test(location.pathname)) speicher.set("vorschaumodus", true);
})();
const VORSCHAU = true;   // in dieser Kopie fest eingeschaltet

const IN_VORSCHAU_ORDNER = /\/vorschau\//.test(location.pathname);

if (VORSCHAU && !IN_VORSCHAU_ORDNER) {
  /* Wer die Vorschau von der Hauptseite aus ablegt, soll die Kopie unter
     /vorschau/ bekommen — die ist eigenständig und startet dort. Hier hilft
     nur ein Hinweis, denn iOS liest das Manifest aus dem urspruenglichen
     HTML und ignoriert diese Änderung beim Ablegen. */
  const titel = document.querySelector('meta[name="apple-mobile-web-app-title"]');
  if (titel) titel.content = "Vámonos Test";
  const anwendung = document.querySelector('meta[name="application-name"]');
  if (anwendung) anwendung.content = "Vámonos Test";
}

const heuteMitternacht = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };

const WOCHENTAG = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];

/* Texte, die eine Frist nennen, müssen mitwandern — ein Türchen bleibt
   ja offen und wird womöglich Tage später noch einmal gelesen. */
const tageBisAbflug = () => {
  const ab = new Date(ABFLUG); ab.setHours(0, 0, 0, 0);
  return Math.max(0, Math.round((ab - heuteMitternacht()) / 86400000));
};
const ZAHLWORT = ["null","ein","zwei","drei","vier","fünf","sechs","sieben","acht","neun","zehn"];
const inTagen = () => {
  const n = tageBisAbflug();
  if (n === 0) return "heute";
  if (n === 1) return "morgen";
  if (n === 2) return "übermorgen";
  return "in " + (ZAHLWORT[n] || n) + " Tagen";
};

(function picado() {
  const svg = $("#picadoSvg");
  const farben = ["var(--carmin)", "var(--oro)", "var(--jade)", "var(--cobalto)", "var(--carmin-hell)"];
  const breite = 60, anzahl = 20;
  const raute = (cx, cy, r) => `M${cx} ${cy - r} L${cx + r} ${cy} L${cx} ${cy + r} L${cx - r} ${cy} Z`;

  // Zwei alternierende Scherenschnitt-Muster, wie bei echten Papel-Picado-Bögen
  function muster(x, m) {
    const c = x + breite / 2;
    if (m === 0) {
      return `
        <path d="${raute(c, 17, 7.5)}" fill="var(--grund)"/>
        <path d="${raute(c - 15, 14, 3.2)}" fill="var(--grund)"/>
        <path d="${raute(c + 15, 14, 3.2)}" fill="var(--grund)"/>
        <path d="${raute(c, 30, 3.4)}" fill="var(--grund)"/>
        <path d="M${x + 6} 26 a5 5 0 0 0 10 0 z" fill="var(--grund)"/>
        <path d="M${x + breite - 16} 26 a5 5 0 0 0 10 0 z" fill="var(--grund)"/>`;
    }
    let r = "";
    for (let k = -2; k <= 2; k++) r += `<path d="${raute(c + k * 10, 13, 3)}" fill="var(--grund)"/>`;
    return r + `
      <path d="M${c - 12} 24 a12 6.5 0 0 0 24 0 z" fill="var(--grund)"/>
      <path d="M${x} 8 a4.5 4.5 0 0 0 9 0 z" fill="var(--grund)"/>
      <path d="M${x + breite - 9} 8 a4.5 4.5 0 0 0 9 0 z" fill="var(--grund)"/>`;
  }

  let s = '<line x1="0" y1="3" x2="1200" y2="3" stroke="var(--linie-satt)" stroke-width="1.4"/>';
  for (let i = 0; i < anzahl; i++) {
    const x = i * breite;
    const f = farben[i % farben.length];
    const d = `M${x} 3 L${x + breite} 3 L${x + breite} 26 L${x + breite / 2} 40 L${x} 26 Z`;
    s += `<g class="flag" style="animation-delay:${(i * 0.13).toFixed(2)}s;transform-origin:${x + breite / 2}px 3px">
      <path d="${d}" fill="${f}" opacity=".88"/>
      ${muster(x, i % 2)}
    </g>`;
  }
  svg.innerHTML = s;
})();

/* ============================================================
   KONFETTI
   ============================================================ */
const konfetti = (() => {
  const c = $("#konfetti"), x = c.getContext("2d");
  let teile = [], laeuft = false;
  const farben = ["#E4AC38", "#B8353F", "#2E9E8F", "#3A5FBF", "#D95560", "#EFEAD9"];

  function groesse() { c.width = innerWidth; c.height = innerHeight; }
  addEventListener("resize", groesse); groesse();

  function schritt() {
    x.clearRect(0, 0, c.width, c.height);
    teile = teile.filter(p => p.y < c.height + 40);
    for (const p of teile) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.13; p.dreh += p.vd;
      x.save();
      x.translate(p.x, p.y);
      x.rotate(p.dreh);
      x.fillStyle = p.f;
      x.globalAlpha = Math.max(0, 1 - p.y / (c.height + 40));
      x.fillRect(-p.b / 2, -p.h / 2, p.b, p.h);
      x.restore();
    }
    if (teile.length) requestAnimationFrame(schritt);
    else { laeuft = false; x.clearRect(0, 0, c.width, c.height); }
  }

  return function feuern(n = 110, ux = 0.5, uy = 0.35) {
    if (reduziert) return;
    groesse();
    for (let i = 0; i < n; i++) {
      teile.push({
        x: c.width * ux + (Math.random() - .5) * 140,
        y: c.height * uy + (Math.random() - .5) * 60,
        vx: (Math.random() - .5) * 9,
        vy: Math.random() * -11 - 3,
        b: 5 + Math.random() * 7,
        h: 3 + Math.random() * 5,
        dreh: Math.random() * 6.28,
        vd: (Math.random() - .5) * .3,
        f: farben[(Math.random() * farben.length) | 0]
      });
    }
    if (!laeuft) { laeuft = true; requestAnimationFrame(schritt); }
  };
})();

function tickKopf() {
  const rest = ABFLUG - new Date();
  const p = (n) => String(Math.max(0, n)).padStart(2, "0");
  if (rest <= 0) {
    $("#uT").textContent = "00"; $("#uH").textContent = "00";
    $("#uM").textContent = "00"; $("#uS").textContent = "00";
    $("#uhrHinweis").textContent = "¡Buen viaje!";
    return;
  }
  const s = Math.floor(rest / 1000);
  $("#uT").textContent = p(Math.floor(s / 86400));
  $("#uH").textContent = p(Math.floor(s / 3600) % 24);
  $("#uM").textContent = p(Math.floor(s / 60) % 60);
  $("#uS").textContent = p(s % 60);
}
tickKopf();
setInterval(tickKopf, 1000);

function feldBauen() {
  const f = $("#feld");
  f.innerHTML = "";
  TUEREN.forEach((t, i) => {
    const frei = istFrei(t.tag);
    const gesehen = speicher.get("gesehen:" + t.tag, false);
    const b = el("button", "tuer t" + (i + 1) + (frei ? "" : " zu") + (istHeute(t.tag) ? " heute" : "") + (gesehen ? " gesehen" : ""));
    b.type = "button";
    b.disabled = !frei;
    b.setAttribute("aria-label", frei
      ? `Türchen ${t.tag}. August öffnen: ${t.titel}`
      : `Türchen ${t.tag}. August — öffnet sich am ${t.tag}. August`);
    b.innerHTML = `
      <span class="datum">${t.tag}. August</span>
      <span class="icon" aria-hidden="true">${symbol(t.sym, i === 0 ? 46 : 32)}</span>
      <span>
        <span class="titel">${t.titel}</span><br>
        <span class="teaser">${t.teaser}</span>
      </span>
      <span class="schloss"><span class="s-icon" aria-hidden="true">${SCHLOSS}</span><span>ab ${t.tag}.8.</span></span>
      ${gesehen ? '<span class="haken">✓</span>' : ""}`;
    if (frei) b.addEventListener("click", () => oeffne(t.tag));
    f.appendChild(b);
  });
}

/* ============================================================
   OVERLAY-STEUERUNG
   ============================================================ */
let letzterFokus = null;

function oeffne(tag) {
  const t = TUEREN.find(x => x.tag === tag);
  letzterFokus = document.activeElement;
  $("#oDatum").textContent = langesDatum(tag) + (istHeute(tag) ? " · heute" : "");
  $("#oTitel").textContent = t.titel;
  $("#oInhalt").innerHTML = "";
  const bau = INHALTE[tag];
  $("#oLead").textContent = bau.lead;
  // Erst sichtbar machen, dann rendern — sonst messen Canvas-Inhalte eine Breite von 0
  $("#overlay").classList.add("auf");
  document.body.style.overflow = "hidden";
  $("#overlay").scrollTop = 0;
  bau.render($("#oInhalt"));
  $("#schliessen").focus();
  if (!speicher.get("gesehen:" + tag, false)) {
    speicher.set("gesehen:" + tag, true);
    setTimeout(() => konfetti(70), 250);
  }
}

function schliesse() {
  $("#overlay").classList.remove("auf");
  document.body.style.overflow = "";
  $("#oInhalt").innerHTML = "";
  feldBauen();
  if (letzterFokus && document.contains(letzterFokus)) letzterFokus.focus();
}

$("#schliessen").addEventListener("click", schliesse);
addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#overlay").classList.contains("auf")) schliesse(); });

/* Entfernung auf der Kugel, für den Kilometerzähler */
const R_ERDE = 6371;
const bogen = (g) => g * Math.PI / 180;
function distanzKm(a, b) {
  const dLat = bogen(b.lat - a.lat), dLon = bogen(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 +
            Math.cos(bogen(a.lat)) * Math.cos(bogen(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R_ERDE * Math.asin(Math.min(1, Math.sqrt(h)));
}
const FLUG_KM = FLUEGE.map(([a, b]) => distanzKm(ORTE[a], ORTE[b]));
const GESAMT_KM = FLUG_KM.reduce((s, k) => s + k, 0);

function zeitraum(e) {
  if (!e.bis) return e.von;
  return e.von + " – " + e.bis;

function etappeZeile(e) {
  const z = el("div", "etappe");
  const naechte = e.naechte
    ? `${e.naechte} ${e.naechte === 1 ? "Nacht" : "Nächte"}`
    : (e.art === "start" ? "Abflug" : e.art === "ziel" ? "Ankunft" : "");
  z.innerHTML = `
    <div class="et-kopf">
      <span class="et-nr">${zeitraum(e)}</span>
      <b class="et-ort">${ORTE[e.o].name}</b>
      <span class="et-daten">${naechte}</span>
    </div>
    <p class="et-fakt">${e.fakt}</p>
    <p class="et-lage">${e.hoehe} über dem Meer · ${e.temp}</p>`;
  (e.dazu || []).forEach(d => {

    const x = px(o.lon), y = py(o.lat);

    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", 0); c.setAttribute("cy", 0); c.setAttribute("r", 3.6);
    c.setAttribute("class", "detail-punkt");
    g.appendChild(c);

    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", 0); t.setAttribute("y", -10);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("class", "detail-label");
    t.textContent = o.name;
    g.appendChild(t);

    svg.appendChild(g);
    ortGruppen[id] = g;
    marker.push({ g, x, y });
    markerSetzen(g, x, y, 1);
  }

  /* --- Regionen als antippbare Punkte ---------------------------- */
  const regionGruppen = {};
  const regionLabels = [];
  REGIONEN.forEach((r, i) => {
    const mittel = r.orte.reduce((a, id) => ({
      lon: a.lon + ORTE[id].lon / r.orte.length,
      lat: a.lat + ORTE[id].lat / r.orte.length
    }), { lon: 0, lat: 0 });
    const x = px(mittel.lon), y = py(mittel.lat);

    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "station");
    g.setAttribute("tabindex", "0");
    g.setAttribute("role", "button");
    g.setAttribute("aria-label", r.titel + " — hineinzoomen");

    const treffer = document.createElementNS(NS, "circle");
    treffer.setAttribute("cx", 0); treffer.setAttribute("cy", 0); treffer.setAttribute("r", 18);
    treffer.setAttribute("fill", "transparent");
    g.appendChild(treffer);

    const ring = document.createElementNS(NS, "circle");
    ring.setAttribute("cx", 0); ring.setAttribute("cy", 0); ring.setAttribute("r", 9);
    ring.setAttribute("class", "stadt-ring");
    ring.style.animationDelay = (i * 0.28) + "s";
    g.appendChild(ring);

    const pkt = document.createElementNS(NS, "circle");
    pkt.setAttribute("cx", 0); pkt.setAttribute("cy", 0);
    pkt.setAttribute("r", r.orte.length > 1 ? 5.4 : 4.2);
    pkt.setAttribute("class", "stadt-punkt");
    pkt.style.animationDelay = (i * 0.28) + "s";
    g.appendChild(pkt);

    const txt = document.createElementNS(NS, "text");
    txt.setAttribute("x", r.dx); txt.setAttribute("y", r.dy);
    txt.setAttribute("text-anchor", r.anker);
    txt.setAttribute("class", "stadt-label");
    txt.style.animationDelay = (i * 0.28 + 0.2) + "s";
    txt.textContent = r.kurz + (r.orte.length > 1 ? "  ·" + r.orte.length : "");
    g.appendChild(txt);

    g.addEventListener("click", () => hinein(r));
    g.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); hinein(r); }
    });
    svg.appendChild(g);
    regionGruppen[r.id] = g;
    marker.push({ g, x, y });
    markerSetzen(g, x, y, 1);
    regionLabels.push({ txt, x, dx: Math.abs(r.dx), anker: r.anker });
  });

  /* Ortsnamen kippen auf die freie Seite, wenn sie sonst aus dem
     Kartenrand laufen — das hängt von der Anzeigebreite ab. */
  function labelsAusrichten(box, k) {
    const links = box[0], rechts = box[0] + box[2];
    regionLabels.forEach(L => {
      L.txt.setAttribute("text-anchor", L.anker);
      L.txt.setAttribute("x", L.anker === "end" ? -L.dx : L.dx);
      let bb;
      try { bb = L.txt.getBBox(); } catch { return; }
      const l = L.x + bb.x * k, r = l + bb.width * k;
      if (l < links + 3) {
        L.txt.setAttribute("text-anchor", "start");
        L.txt.setAttribute("x", L.dx);
      } else if (r > rechts - 3) {
        L.txt.setAttribute("text-anchor", "end");
        L.txt.setAttribute("x", -L.dx);
      }
    });
  }

  /* --- Maßstab, nur im Zoom ------------------------------------- */
  const massstab = document.createElementNS(NS, "g");
  massstab.setAttribute("class", "massstab");
  const msLinie = document.createElementNS(NS, "path");
  massstab.appendChild(msLinie);
  const msText = document.createElementNS(NS, "text");
  massstab.appendChild(msText);
  svg.appendChild(massstab);

  const STUFEN = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000];

  function massstabSetzen(box, k) {
    // Kilometer pro Längengrad hängen von der Breite ab
    const mittelLat = LAT0 - (box[1] + box[3] / 2) / H * LAT_SPAN;
    const kmProGrad = 111.32 * Math.cos(bogen(mittelLat));
    const sichtbareKm = box[2] / B * LON_SPAN * kmProGrad;
    const ziel = STUFEN.find(s => s >= sichtbareKm * 0.22) || 5000;
    const laenge = ziel / sichtbareKm * box[2];

    const x = box[0] + box[2] * 0.06;
    const y = box[1] + box[3] * 0.93;
    const zacke = 4 * k;
    msLinie.setAttribute("d",
      `M${x} ${y - zacke} V${y} H${x + laenge} V${y - zacke}`);
    msLinie.setAttribute("fill", "none");
    msLinie.setAttribute("stroke", "var(--schrift-2)");
    msLinie.setAttribute("stroke-width", 1.4 * k);
    msText.setAttribute("x", x);
    msText.setAttribute("y", y - 7 * k);
    msText.setAttribute("transform", `translate(${x} ${y - 7 * k}) scale(${k}) translate(${-x} ${-(y - 7 * k)})`);
    msText.textContent = ziel >= 1000 ? (ziel / 1000) + ".000 km" : ziel + " km";
  }

  /* --- Flugzeug für die Abflug-Animation ------------------------- */
  const flieger = document.createElementNS(NS, "g");
  flieger.setAttribute("class", "flieger-marke");
  flieger.setAttribute("hidden", "");
  const fSym = document.createElementNS(NS, "text");
  fSym.setAttribute("class", "flieger-form");
  fSym.setAttribute("text-anchor", "middle");
  fSym.setAttribute("dominant-baseline", "central");
  fSym.textContent = "✈️";
  flieger.appendChild(fSym);
  svg.appendChild(flieger);

  /* --- Zoomen ---------------------------------------------------- */
  let aktuelleBox = GRUND.slice();
  let animation = null;

  function boxAnimieren(ziel, dauer = 620) {
    if (animation) cancelAnimationFrame(animation);
    const start = aktuelleBox.slice();
    if (reduziert) { boxSetzen(ziel); return; }
    const t0 = performance.now();
    const lauf = (jetzt) => {
      const p = Math.min(1, (jetzt - t0) / dauer);
      const e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;   // easeInOutCubic
      boxSetzen(start.map((v, i) => v + (ziel[i] - v) * e));
      if (p < 1) animation = requestAnimationFrame(lauf);
    };
    animation = requestAnimationFrame(lauf);
  }

  /* Gegenskalierung: nicht nur gegen den Zoom, sondern auch gegen die
     Anzeigebreite — sonst schrumpfen die Ortsnamen auf dem Handy auf
     sechs Pixel. Unter 430 px wird nicht weiter hochskaliert, sonst
     überlappen sich die Beschriftungen in der Übersicht. */
  function faktor(box) {
    const breite = svg.getBoundingClientRect().width;
    return box[2] / Math.max(breite || B, 430);
  }

  function boxSetzen(box) {
    aktuelleBox = box;
    svg.setAttribute("viewBox", box.map(v => v.toFixed(2)).join(" "));
    const k = faktor(box);
    svg.style.setProperty("--k", k.toFixed(4));
    marker.forEach(m => markerSetzen(m.g, m.x, m.y, k));
    massstabSetzen(box, k);
    labelsAusrichten(box, k);
  }

  // Bei Größenänderung neu ausrechnen
  if (window.ResizeObserver) {
    let letzteBreite = 0;
    new ResizeObserver(() => {
      const b = Math.round(svg.getBoundingClientRect().width);
      if (b && b !== letzteBreite) { letzteBreite = b; boxSetzen(aktuelleBox); }
    }).observe(svg);
  }

  /* Bildausschnitt, der alle genannten Orte umfasst — mit Rand,
     Mindestgröße und dem Seitenverhältnis der Grundkarte. */
  function boxFuerOrte(ids, padGrad, minGrad) {
    const lons = ids.map(id => ORTE[id].lon), lats = ids.map(id => ORTE[id].lat);
    const padX = padGrad * B / LON_SPAN, padY = padGrad * H / LAT_SPAN;
    let bx = px(Math.min(...lons)) - padX;
    let by = py(Math.max(...lats)) - padY;
    let bw = px(Math.max(...lons)) - px(Math.min(...lons)) + 2 * padX;
    let bh = py(Math.min(...lats)) - py(Math.max(...lats)) + 2 * padY;

    const minW = (minGrad || 0) * B / LON_SPAN;
    if (bw < minW) { bx -= (minW - bw) / 2; bw = minW; }

    const soll = H / B;
    if (bh / bw < soll) { const n = bw * soll; by -= (n - bh) / 2; bh = n; }
    else { const n = bh / soll; bx -= (n - bw) / 2; bw = n; }
    return [bx, by, bw, bh];
  }

  function hinein(r) {
    if (fliegtGerade) return;
    boxAnimieren(boxFuerOrte(r.orte, 0.6, 2.6));

    svg.classList.add("gezoomt");
    Object.values(regionGruppen).forEach(g => g.classList.add("weg"));
    Object.entries(ortGruppen).forEach(([id, g]) =>
      g.classList.toggle("sichtbar", r.orte.includes(id)));

    $("#kTitel").textContent = r.titel;
    $("#kZurueck").hidden = false;

    // Übernachtungen und Ausflüge dieser Region, in zeitlicher Reihenfolge
    const stuecke = [];
    ETAPPEN.forEach(e => {
      if (r.orte.includes(e.o)) stuecke.push({
        wann: zeitraum(e), ort: ORTE[e.o].name, fakt: e.fakt,
        rechts: e.naechte ? e.naechte + (e.naechte === 1 ? " Nacht" : " Nächte") : ""
      });
      (e.dazu || []).forEach(d => {
        if (r.orte.includes(d.o) && d.o !== e.o)
          stuecke.push({ wann: d.wann, ort: ORTE[d.o].name, fakt: d.fakt, rechts: d.was });
      });
    });

    info.innerHTML = stuecke.map(s => `
      <div class="ki-eintrag">
        <div class="ki-kopf"><span class="ki-nr">${s.wann}</span>
        <b>${s.ort}</b>
        <span class="ki-daten">${s.rechts}</span></div>
        <p>${s.fakt}</p>
      </div>`).join("") || '<span class="ki-leer">Keine Übernachtung hier</span>';
  }

  function hinaus() {
    boxAnimieren(GRUND);
    svg.classList.remove("gezoomt");
    Object.values(regionGruppen).forEach(g => g.classList.remove("weg"));
    Object.values(ortGruppen).forEach(g => g.classList.remove("sichtbar"));
    $("#kTitel").textContent = "Die Strecke";
    $("#kZurueck").hidden = true;
    info.innerHTML = '<span class="ki-leer">Tipp eine Region an</span>';
  }

  panel.querySelector("#kZurueck").addEventListener("click", hinaus);

  /* --- Die Route abfliegen ---------------------------------------
     Die Kamera folgt dem Flugzeug: nah an Frankfurt starten, für den
     Atlantikflug herauszoomen, über Amerika wieder hinein, zum Schluss
     zurück nach Deutschland. Segmentzeiten und Kamerafahrten laufen auf
     derselben Zeitachse, sind aber getrennt gesteuert. */
  let fliegtGerade = false;

  /* Segment 0 und 9 überqueren den Atlantik, 1–2 führen quer durch
     Lateinamerika, 3–8 sind Inlandsflüge in Argentinien, 10 ist der
     letzte Hüpfer nach München. Jede Gruppe bekommt ihren Ausschnitt. */
  const AM_VON = 1, AM_BIS = 2, AR_VON = 3, AR_BIS = 8;
  const ZEIT = { start: 1.4, atlantikHin: 4.0, amerika: 4.2, argentinien: 7.4, atlantikZur: 3.4, heimat: 1.8 };
  const T_HIN         = ZEIT.start;
  const T_AMERIKA     = T_HIN + ZEIT.atlantikHin;
  const T_ARGENTINIEN = T_AMERIKA + ZEIT.amerika;
  const T_ZURUECK     = T_ARGENTINIEN + ZEIT.argentinien;
  const T_HEIMAT      = T_ZURUECK + ZEIT.atlantikZur;
  const T_ENDE        = T_HEIMAT + ZEIT.heimat;

  // Eine Gruppe von Segmenten auf ihr Zeitfenster verteilen, nach Streckenlänge
  function gruppe(plan, von, bis, tVon, dauer) {
    const km = FLUG_KM.slice(von, bis + 1);
    const summe = km.reduce((s, k) => s + k, 0) || 1;
    let t = tVon;
    km.forEach((k, i) => {
      const d = dauer * k / summe;
      plan.push({ seg: von + i, von: t, bis: t + d });
      t += d;
    });
  }

  function segmentPlan() {
    const plan = [];
    plan.push({ seg: 0, von: T_HIN, bis: T_AMERIKA });
    gruppe(plan, AM_VON, AM_BIS, T_AMERIKA, ZEIT.amerika);
    gruppe(plan, AR_VON, AR_BIS, T_ARGENTINIEN, ZEIT.argentinien);
    plan.push({ seg: FLUEGE.length - 2, von: T_ZURUECK, bis: T_HEIMAT });
    plan.push({ seg: FLUEGE.length - 1, von: T_HEIMAT, bis: T_ENDE });
    return plan;
  }

  function kameraPlan() {
    const dt = boxFuerOrte(["fra", "muc"], 2.5, 9);
    const am = boxFuerOrte(["cdmx", "lim", "bue"], 6, 0);
    const ar = boxFuerOrte(["bue", "bar", "cal", "sla", "igu"], 3, 0);
    return [
      { t: 0,                   box: dt },
      { t: T_HIN,               box: dt },
      { t: T_HIN + 1.5,         box: GRUND },
      { t: T_AMERIKA - 0.2,     box: GRUND },
      { t: T_AMERIKA + 1.3,     box: am },
      { t: T_ARGENTINIEN - 0.4, box: am },
      { t: T_ARGENTINIEN + 1.2, box: ar },
      { t: T_ZURUECK - 0.9,     box: ar },
      { t: T_ZURUECK + 0.8,     box: GRUND },
      { t: T_HEIMAT - 0.5,      box: GRUND },
      { t: T_HEIMAT + 1.0,      box: dt },
      { t: T_ENDE + 1.2,        box: dt }
    ];
  }

  function boxMischen(a, b, e) { return a.map((v, i) => v + (b[i] - v) * e); }

  panel.querySelector("#kFliegen").addEventListener("click", () => {
    if (fliegtGerade) return;
    const knopf = panel.querySelector("#kFliegen");

    // Zoomzustand und laufende Kamerafahrten zurücksetzen
    if (animation) cancelAnimationFrame(animation);
    svg.classList.remove("gezoomt");
    Object.values(regionGruppen).forEach(g => g.classList.remove("weg"));
    Object.values(ortGruppen).forEach(g => g.classList.remove("sichtbar"));
    $("#kTitel").textContent = "Die Strecke";
    $("#kZurueck").hidden = true;
    info.innerHTML = '<span class="ki-leer">Unterwegs …</span>';

    const laengen = flugPfade.map(p => { try { return p.getTotalLength(); } catch { return 0; } });
    const plan = segmentPlan();
    const kamera = kameraPlan();

    if (reduziert) {
      $("#kZaehler").textContent = Math.round(GESAMT_KM).toLocaleString("de-DE") + " km";
      info.innerHTML = '<span class="ki-leer">Tipp eine Region an</span>';
      return;
    }

    fliegtGerade = true;
    knopf.disabled = true;
    flieger.removeAttribute("hidden");
    let heimatSichtbar = null;

    const t0 = performance.now();
    const schritt = (jetzt) => {
      if (!document.contains(svg)) { fliegtGerade = false; return; }
      const t = (jetzt - t0) / 1000;

      /* Kamera */
      let a = kamera[0], b = kamera[kamera.length - 1];
      for (let i = 0; i < kamera.length - 1; i++)
        if (t >= kamera[i].t && t <= kamera[i + 1].t) { a = kamera[i]; b = kamera[i + 1]; break; }
      if (t > kamera[kamera.length - 1].t) a = b = kamera[kamera.length - 1];
      const spanne = Math.max(.001, b.t - a.t);
      const q = Math.max(0, Math.min(1, (t - a.t) / spanne));
      const e = q < .5 ? 4 * q * q * q : 1 - Math.pow(-2 * q + 2, 3) / 2;
      boxSetzen(boxMischen(a.box, b.box, e));

      // In den Deutschland-Phasen die beiden Flughäfen benennen
      const nah = t < T_HIN + 1.2 || t > T_HEIMAT + 0.4;
      if (nah !== heimatSichtbar) {
        heimatSichtbar = nah;
        ["fra", "muc"].forEach(id => ortGruppen[id].classList.toggle("sichtbar", nah));
        Object.values(regionGruppen).forEach(g => g.classList.toggle("weg", nah));
      }

      /* Flugzeug */
      let seg = plan[0], anteil = 0;
      if (t <= plan[0].von) { seg = plan[0]; anteil = 0; }
      else {
        seg = plan[plan.length - 1]; anteil = 1;
        for (const s of plan)
          if (t >= s.von && t <= s.bis) { seg = s; anteil = (t - s.von) / (s.bis - s.von); break; }
      }

      try {
        const pfad = flugPfade[seg.seg], L = laengen[seg.seg];
        const pos = pfad.getPointAtLength(L * anteil);
        const vor = pfad.getPointAtLength(Math.min(L, L * anteil + Math.max(1, L * 0.01)));
        // Das Emoji zeigt von Haus aus nach rechts oben, daher die 45 Grad Ausgleich
        const winkel = Math.atan2(vor.y - pos.y, vor.x - pos.x) * 180 / Math.PI + 45;
        flieger.setAttribute("transform",
          `translate(${pos.x.toFixed(2)} ${pos.y.toFixed(2)}) rotate(${winkel.toFixed(1)}) scale(${faktor(aktuelleBox).toFixed(4)})`);
      } catch {}

      // Kilometer aus den echten Distanzen, nicht aus der Pfadlänge
      const km = FLUG_KM.slice(0, seg.seg).reduce((s, k) => s + k, 0) + FLUG_KM[seg.seg] * anteil;
      $("#kZaehler").textContent = Math.round(km).toLocaleString("de-DE") + " km";

      if (t < T_ENDE) requestAnimationFrame(schritt);
      else {
        flieger.setAttribute("hidden", "");            // angekommen, also weg damit
        $("#kZaehler").textContent = Math.round(GESAMT_KM).toLocaleString("de-DE") + " km";
        knopf.disabled = false;
        knopf.textContent = "Nochmal abfliegen";
        fliegtGerade = false;
        // Nach kurzem Verweilen in München zurück auf die Gesamtansicht
        setTimeout(() => {
          if (fliegtGerade || svg.classList.contains("gezoomt")) return;
          ["fra", "muc"].forEach(id => ortGruppen[id].classList.remove("sichtbar"));
          Object.values(regionGruppen).forEach(g => g.classList.remove("weg"));
          heimatSichtbar = null;
          boxAnimieren(GRUND, 900);
          info.innerHTML = '<span class="ki-leer">Tipp eine Region an</span>';
        }, 1600);
      }
    };
    requestAnimationFrame(schritt);
  });

  return panel;
}

function rubbeln(cv, box, idx) {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  let bereit = false;

  function initialisieren() {
    const b = box.getBoundingClientRect();
    if (b.width < 10) { requestAnimationFrame(initialisieren); return; }
    // Höhe vom Inhalt übernehmen, damit die Schicht ihn vollständig deckt
    const H = Math.max(128, b.height);
    cv.width = b.width * dpr;
    cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const g = ctx.createLinearGradient(0, 0, b.width, H);
    g.addColorStop(0, "#B07F1E");
    g.addColorStop(.45, "#E4AC38");
    g.addColorStop(.55, "#F3D890");
    g.addColorStop(1, "#B07F1E");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, b.width, H);

    // Feine Talavera-Rauten in die Rubbelschicht
    ctx.strokeStyle = "rgba(16,26,46,.16)";
    ctx.lineWidth = 1;
    for (let x = -H; x < b.width + H; x += 16) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + H, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + H, 0); ctx.lineTo(x, H); ctx.stroke();
    }

    ctx.fillStyle = "rgba(16,26,46,.62)";
    ctx.font = "600 11px ui-monospace, monospace";
    ctx.textAlign = "center";
    ctx.letterSpacing = "3px";
    ctx.fillText("HIER RUBBELN", b.width / 2, H / 2 + 4);

    ctx.globalCompositeOperation = "destination-out";
    bereit = true;
  }
  initialisieren();

  let malt = false;

  function punkt(e) {
    const r = cv.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  function kratzen(e) {
    if (!bereit) return;
    e.preventDefault();
    const p = punkt(e);
    ctx.beginPath();
    ctx.arc(p.x, p.y, 21, 0, 7);
    ctx.fill();
  }
  function pruefen() {
    if (!bereit) return;
    const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
    let leer = 0;
    for (let i = 3; i < d.length; i += 40) if (d[i] < 30) leer++;
    if (leer / (d.length / 40) > 0.52) {
      box.classList.add("frei");
      speicher.set("los:" + idx, true);
      konfetti(60, .5, .4);
    }
  }

  const start = (e) => { malt = true; kratzen(e); };
  const zug   = (e) => { if (malt) kratzen(e); };
  const ende  = () => { if (malt) { malt = false; pruefen(); } };

  cv.addEventListener("mousedown", start);
  cv.addEventListener("mousemove", zug);
  addEventListener("mouseup", ende);
  cv.addEventListener("touchstart", start, { passive: false });
  cv.addEventListener("touchmove", zug, { passive: false });
  cv.addEventListener("touchend", ende);
}

function kofferSpiel() {

        }
        if (o.y > H + 20) {
          if (o.d.gut) { leben--; blitz(o.x, H - 30, "verpasst", "#D95560"); }
          return false;
        }
        return true;
      });

      if (leben <= 0) return schluss();
      $("#sPunkte").textContent = punkte;
      $("#sLeben").textContent = "♥".repeat(Math.max(0, leben)) + "♡".repeat(LEBEN_START - Math.max(0, leben));
    }

    ctx.font = "26px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const o of objekte) {
      if (o.d.bonus) {                       // Goldring, damit der Hauptgewinn auffällt
        ctx.beginPath();
        ctx.arc(o.x, o.y, 21, 0, 7);
        ctx.strokeStyle = "#E4AC38";
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }
      ctx.fillText(o.d.z, o.x, o.y);
    }

    zeichneKoffer();

    blitze = blitze.filter(b => b.t > 0);
    for (const b of blitze) {
      b.t -= dt; b.y -= 1.1 * dt;
      ctx.globalAlpha = Math.max(0, b.t / 45);
      ctx.fillStyle = b.f;
      ctx.font = "600 13px ui-monospace, monospace";
      ctx.fillText(b.s, b.x, b.y);
      ctx.globalAlpha = 1;
    }

    raf = requestAnimationFrame(schleife);
  }

  function blitz(x, y, s, f) { blitze.push({ x, y, s, f, t: 45 }); }

  function start() {
    objekte = []; punkte = 0; leben = LEBEN_START; tick = 0; tempo = 0.7; blitze = [];
    letzterStempel = 0; spawnZaehler = 60;   // kurzer Vorlauf, bevor das Erste fällt
    laeuft = true;
    ov.classList.add("weg");
    cancelAnimationFrame(raf);
    schleife();
  }

  function schluss() {
    laeuft = false;
    cancelAnimationFrame(raf);
    const best = speicher.get("kofferBest", 0);
    const neu = punkte > best;
    if (neu) { speicher.set("kofferBest", punkte); konfetti(120); }
    $("#sBest").textContent = Math.max(best, punkte);
    ov.classList.remove("weg");
    ov.innerHTML = `
      <h4>${neu ? "Neuer Rekord" : "Koffer voll"}</h4>
      <p style="font-family:var(--mono);font-size:1.9rem;color:var(--oro);font-weight:600">${punkte}</p>
      <p>${punkte >= 150 ? "Beeindruckend. Du packst offenbar auch im echten Leben effizient."
         : punkte >= 80 ? "Ordentlich. Der Weihnachtsbaum bleibt trotzdem zu Hause."
         : "Naja. Wir packen den Koffer besser gemeinsam."}</p>
      <button class="btn" id="sStart">Nochmal</button>`;
    $("#sStart").addEventListener("click", start);
    $("#sStart").focus();
  }

  $("#sStart").addEventListener("click", start);

  cv.addEventListener("mousemove", e => {
    const r = cv.getBoundingClientRect();
    koffer.x = e.clientX - r.left;
  });
  cv.addEventListener("touchmove", e => {
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    koffer.x = e.touches[0].clientX - r.left;
  }, { passive: false });

  const runter = e => {
    if (e.key === "ArrowLeft")  { links = true;  e.preventDefault(); }
    if (e.key === "ArrowRight") { rechts = true; e.preventDefault(); }
  };
  const rauf = e => {
    if (e.key === "ArrowLeft")  links = false;
    if (e.key === "ArrowRight") rechts = false;
  };
  addEventListener("keydown", runter);
  addEventListener("keyup", rauf);

  // Aufräumen, wenn das Overlay geschlossen wird
  const beobachter = new MutationObserver(() => {
    if (!$("#overlay").classList.contains("auf")) {
      laeuft = false;
      cancelAnimationFrame(raf);
      removeEventListener("keydown", runter);
      removeEventListener("keyup", rauf);
      beobachter.disconnect();
    }
  });
  beobachter.observe($("#overlay"), { attributes: true, attributeFilter: ["class"] });

  schleife();
}

function sprich(text) {
  try {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "es-MX";
    u.rate = 0.88;
    const stimmen = speechSynthesis.getVoices();
    const s = stimmen.find(v => /^es[-_]/i.test(v.lang));
    if (s) u.voice = s;
    speechSynthesis.speak(u);
  } catch {}
}

// Beim ersten Besuch: kleiner Empfang
/* Kommt die Seite nach längerer Pause zurück, einmal frisch holen.
   Ein Startbildschirm-Symbol kann tagelang im Speicher liegen und
   würde sonst alte Inhalte und einen stehengebliebenen Countdown
   zeigen. Der Fortschritt bleibt dabei erhalten, er liegt im
   Speicher des Geräts und nicht in der Seite. */
(() => {
  let weg = 0;
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { weg = Date.now(); return; }
    const pause = weg ? Date.now() - weg : 0;
    weg = 0;
    if (pause > 20 * 60 * 1000 && !$("#overlay").classList.contains("auf")) {
      location.reload();
    }
  });
})();
